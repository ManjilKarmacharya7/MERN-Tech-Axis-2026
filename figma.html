<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viss Fashion</title>
    <link rel="stylesheet" href="./figma.css" />
  </head>
  <body>
    <!-- This a navbar -->
    <nav>
      <h1 class="logo">Viss Fashions</h1>
      <div class="navlink">
        <a href="#">About</a>
        <a href="#">Clothing</a>
        <a href="#">Accessories</a>
        <a href="#">Services</a>
      </div>

      <div class="btn">
        <a href="#" class="login">Log in</a>
        <button class="signup">Sign up</button>
      </div>

    <!-- This is hero section -->
    <section class="hero">

        <p class="eyebrow">Trendiest Fashion ever</p>

        <button class="buy-now-btn">Buy now</button>
      </div>

      <div class="hero-image">
        <img src="figma design.jpg" alt="hero image" />
      </div>
    </section>
